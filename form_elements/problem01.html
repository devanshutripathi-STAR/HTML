
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Admission Application</title>
</head>
<body>

    <h1>College Admission Application Form</h1>

    <p>
        Welcome to the college admission application portal.
        Please fill in all required details carefully.
    </p>

    <img src="https://images.unsplash.com/photo-1564981797816-1043664bf78d"
         alt="College campus building"
         width="400">

    <hr>

    <form action="#" method="post">

        <h2>Personal Information</h2>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="full_name"
               placeholder="Enter your full name"
               minlength="3" maxlength="60" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="date_of_birth"
               min="1990-01-01" max="2010-12-31" required>
        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="student@example.com"
               autocomplete="email" required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile"
               placeholder="10-digit mobile number"
               pattern="[6-9][0-9]{9}"
               maxlength="10" required>
        <br><br>

        <label for="pin">Application PIN:</label>
        <input type="password" id="pin" name="application_pin"
               minlength="6" maxlength="12" required>
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <h2>Category and Program</h2>

        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="">Select Category</option>
            <option value="general">General</option>
            <option value="obc">OBC</option>
            <option value="sc">SC</option>
            <option value="st">ST</option>
            <option value="ews">EWS</option>
        </select>
        <br><br>

        <label for="program">Choose Program:</label>
        <select id="program" name="program" required>
            <option value="">Select Program</option>
            <option value="cse">Computer Science Engineering</option>
            <option value="aiml">CSE Artificial Intelligence and ML</option>
            <option value="ece">Electronics and Communication</option>
            <option value="me">Mechanical Engineering</option>
            <option value="ce">Civil Engineering</option>
            <option value="bba">Bachelor of Business Administration</option>
        </select>

        <h2>Previous Qualification</h2>

        <label for="qualification">Qualification:</label>
        <select id="qualification" name="qualification" required>
            <option value="">Select Qualification</option>
            <option value="12th">Class 12</option>
            <option value="diploma">Diploma</option>
            <option value="graduation">Graduation</option>
        </select>
        <br><br>

        <label for="percentage">Percentage / CGPA:</label>
        <input type="number" id="percentage" name="percentage"
               min="0" max="100" step="0.01" required>
        <br><br>

        <label for="passing_year">Passing Year:</label>
        <input type="number" id="passing_year" name="passing_year"
               min="2000" max="2030" required>
        <br><br>

        <label for="school">School / College Name:</label>
        <input type="text" id="school" name="school_name"
               minlength="3" maxlength="100" required>
        <br><br>

        <h2>Address</h2>

        <label for="address">Permanent Address:</label><br>
        <textarea id="address" name="permanent_address"
                  rows="5" cols="40"
                  minlength="10" maxlength="300"
                  placeholder="Enter your complete address"
                  required></textarea>
        <br><br>

        <h2>Additional Information</h2>

        <p>Select your interests:</p>

        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>

        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>

        <input type="checkbox" id="cultural" name="interests" value="cultural">
        <label for="cultural">Cultural Activities</label>

        <br><br>

        <label for="document">Upload Admission Document:</label>
        <input type="file" id="document" name="admission_document"
               accept=".pdf,.jpg,.jpeg,.png">
        <br><br>

        <input type="checkbox" id="declaration" name="declaration"
               value="accepted" required>
        <label for="declaration">
            I declare that the information provided is correct.
        </label>

        <br><br>

        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
